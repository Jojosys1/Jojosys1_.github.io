# Configuration du site académique — GLODJO Jolémon
# Basée sur la structure du template Academic Pages / Jekyll.

# Paramètres généraux du site
locale                   : "fr-FR"
site_theme               : "default"
title                    : "Mawounan Jolémon GLODJO"
title_separator          : "-"
name                     : &name "Mawounan Jolémon GLODJO"
description              : &description "Portfolio académique de Mawounan Jolémon GLODJO : génie mathématique, modélisation, intelligence artificielle et analyse de données."
url                      : "https://jojosys1.github.io"
baseurl                  : ""
repository               : "Jojosys1/Jojosys1.github.io"

# Profil affiché dans la barre latérale
author:
  avatar           : "profile.png"
  name             : "Mawounan Jolémon GLODJO"
  bio              : "Élève ingénieur en Génie Mathématique et Modélisation"
  location         : "Calavi, Bénin"
  employer         : "École Nationale Supérieure de Génie Mathématique et Modélisation (ENSGMM)"
  email            : "glodjojolemon0@gmail.com"
  github           : "Jojosys1"

# Liens académiques : à compléter lorsque les profils existent.
  academia         :
  arxiv            :
  googlescholar    :
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

# Comptes et réseaux sociaux : seuls les comptes renseignés apparaissent.
  bitbucket        :
  codepen          :
  dribbble         :
  kaggle           :
  stackoverflow    :
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# Catégories des publications (elles seront utiles lorsque des publications seront ajoutées).
publication_category:
  articles:
    title: "Articles scientifiques"
  preprints:
    title: "Prépublications et manuscrits"
  books:
    title: "Ouvrages et chapitres"
  proceedings:
    title: "Actes et contributions"

# Paramètres du site
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Commentaires désactivés par défaut.
comments:
  provider               : false

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "master"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"

atom_feed:
  hide                   : false
  path                   :

# SEO
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Partage social
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "og-image.png"
og_description           : "Portfolio académique de Mawounan Jolémon GLODJO."

social:
  type                   : "Person"
  name                   : "Mawounan Jolémon GLODJO"
  links:
    - "https://github.com/Jojosys1"

# Analytique désactivée tant qu'aucun identifiant n'est configuré.
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Fichiers à inclure dans le traitement Jekyll.
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - README_SITE.md
  - templates
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion Markdown
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections natives du template Academic Pages.
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  creations:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Valeurs par défaut des pages et collections.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: creations
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass / SCSS
sass:
  sass_dir: _sass
  style: compressed

# URLs et dates
permalink: /:categories/:title/
timezone: "Africa/Porto-Novo"

# Plugins requis par le thème (également présents dans le Gemfile).
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Compatibilité Jekyll / GitHub Pages
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# Compression HTML
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
